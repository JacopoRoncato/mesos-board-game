# character-manifest.properties
# Maps PDF page index (1-based) to CHARACTER_TYPE,ERA for character cards.
# Generated by corner-icon visual classification (extract_corners.py).
#
# Era boundaries verified from page sequence:
#   Era I   = pages 001-029 (29 character cards)
#   Era II  = pages 030-057 (28 character cards)
#   Era III = pages 058-084 (27 character cards)
#
# Type icon identification (top-right circle badge, ~x=420-554, y=40-130 of 554x790):
#   HUNTER   = red/orange circle, bow-and-arrow icon
#   INVENTOR = dark maroon circle, compass / prehistoric-tools icon
#   GATHERER = orange circle, basket-with-food icon
#   SHAMAN   = yellow circle, Egyptian-headdress / eye icon
#   ARTIST   = teal circle, open-hand / cave-art icon
#   BUILDER  = rose-crimson circle, spiral-sun icon
#
# Format: page.NNN=TYPE,ERA   (NNN zero-padded to 3 digits)

